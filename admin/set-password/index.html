<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/yuan.css?v=69f90e76">
<link rel="stylesheet" href="/assets/admin.css">
<title>Set your password — Yuan Market Admin</title>
</head>
<body>
<div class="field" aria-hidden="true"><i class="f1"></i><i class="f2"></i><i class="f3"></i></div>
<main class="shell" style="max-width:460px;padding-block:clamp(28px,6vw,72px)">
  <div class="glass-2" style="border-radius:var(--r-2xl);padding:clamp(22px,4vw,36px)">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:20px">
      <span class="mark">元</span>
      <div style="font-family:var(--display);font-weight:680;font-size:17px">Set your password</div>
    </div>
    <p class="muted" style="font-size:13.5px;line-height:1.7;margin-bottom:20px">
      Choose a password only you know. It is stored as an irreversible hash —
      nobody, including this system, can read it back.
    </p>
    <div id="err" class="err" style="display:none;margin-bottom:14px;padding:11px 14px;border-radius:12px;
         background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 32%,transparent)"></div>
    <div id="ok" style="display:none"></div>
    <form id="setForm">
      <label class="field-l">New password</label>
      <input class="inp" type="password" name="password" autocomplete="new-password" required minlength="6">
      <div class="hint">At least 6 characters. Not all the same, not sequential.</div>
      <div style="height:14px"></div>
      <label class="field-l">Type it again</label>
      <input class="inp" type="password" name="confirm" autocomplete="new-password" required minlength="6">
      <div style="height:20px"></div>
      <button class="btn btn-gold btn-block btn-lg" type="submit">Save password and sign in</button>
    </form>
  </div>
</main>
<script src="/assets/i18n.js?v=717b33b3"></script>
<script src="/assets/yuan.js?v=835b52a2"></script>
<script src="/assets/set-password.js"></script>
</body>
</html>

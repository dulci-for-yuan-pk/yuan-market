<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<meta name="robots" content="noindex">
<title>Sign in — Yuan Market | yuan.pk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/yuan.css?v=69f90e76">
</head>
<body>
<div class="field" aria-hidden="true"><i class="f1"></i><i class="f2"></i><i class="f3"></i></div>
<div class="noise" aria-hidden="true"></div>

<nav class="nav" id="nav">
  <a class="brand" href="/"><span class="mark">元</span><span><b>yuan<i>.pk</i></b><small data-t="brand.sub"></small></span></a>
  <div class="navtools" style="margin-inline-start:auto">
    <button class="chip sq" id="themeBtn" data-t-aria="act.theme"><span id="themeIco">☾</span></button>
    <button class="chip" id="langBtn" data-t-aria="act.lang"><span id="langLabel">اردو</span></button>
    <span id="authSlot"></span>
  </div>
</nav>

<main class="shell" style="max-width:520px;padding-block:clamp(24px,5vw,56px)">
  <div class="glass-2 flip" style="border-radius:var(--r-2xl);padding:clamp(22px,4vw,38px)" id="authCard">

    <div class="seg" id="tabs" role="tablist" style="width:100%;margin-bottom:24px">
      <button role="tab" aria-selected="true"  data-tab="login"    style="flex:1" data-t="auth.tab.login"></button>
      <button role="tab" aria-selected="false" data-tab="register" style="flex:1" data-t="auth.tab.register"></button>
    </div>

    <div id="err" class="err" style="display:none;margin-bottom:16px;padding:11px 14px;border-radius:12px;
         background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 32%,transparent)"></div>

    <!-- LOGIN -->
    <form id="loginForm" autocomplete="on">
      <label class="field-l" data-t="auth.phone"></label>
      <input class="inp num" type="tel" name="phone" inputmode="tel" autocomplete="tel"
             placeholder="03xx xxxxxxx" required>
      <div style="height:16px"></div>
      <label class="field-l" data-t="auth.passcode"></label>
      <input class="inp" type="password" name="passcode" autocomplete="current-password" required>
      <div style="height:22px"></div>
      <button class="btn btn-gold btn-block btn-lg" type="submit" data-t="auth.submit.login"></button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" autocomplete="on" style="display:none">
      <label class="field-l" data-t="auth.name"></label>
      <input class="inp" type="text" name="name" autocomplete="name" required>
      <div style="height:14px"></div>
      <label class="field-l" data-t="auth.business"></label>
      <input class="inp" type="text" name="business_name" autocomplete="organization">
      <div style="height:14px"></div>
      <label class="field-l" data-t="auth.city"></label>
      <input class="inp" type="text" name="city" autocomplete="address-level2">
      <div style="height:14px"></div>
      <label class="field-l" data-t="auth.phone"></label>
      <input class="inp num" type="tel" name="phone" inputmode="tel" autocomplete="tel"
             placeholder="03xx xxxxxxx" required>
      <div style="height:14px"></div>
      <label class="field-l" data-t="auth.passcode"></label>
      <input class="inp" type="password" name="passcode" autocomplete="new-password" required minlength="6">
      <div class="hint" data-t="auth.passcode.hint"></div>
      <div style="height:22px"></div>
      <button class="btn btn-gold btn-block btn-lg" type="submit" data-t="auth.submit.register"></button>
    </form>

    <!-- GOOGLE -->
    <div id="googleWrap" style="display:none">
      <div style="display:flex;align-items:center;gap:12px;margin-block:22px">
        <span style="flex:1;height:1px;background:var(--hair)"></span>
        <span class="dim" style="font-size:12px" data-t="auth.or"></span>
        <span style="flex:1;height:1px;background:var(--hair)"></span>
      </div>
      <div id="gbtn" style="display:flex;justify-content:center"></div>
    </div>

    <!-- INVITE -->
    <details style="margin-top:24px;border-top:1px solid var(--hair);padding-top:18px">
      <summary style="cursor:pointer;font-size:14px;font-weight:600" data-t="auth.invite.title"></summary>
      <form id="inviteForm" style="margin-top:16px">
        <label class="field-l" data-t="auth.invite.code"></label>
        <input class="inp ltr" type="text" name="code" autocapitalize="characters" required>
        <div class="hint" data-t="auth.invite.hint"></div>
        <div style="height:14px"></div>
        <label class="field-l" data-t="auth.name"></label>
        <input class="inp" type="text" name="name">
        <div style="height:14px"></div>
        <label class="field-l" data-t="auth.passcode"></label>
        <input class="inp" type="password" name="passcode" autocomplete="new-password" required minlength="6">
        <div style="height:18px"></div>
        <button class="btn btn-glass btn-block" type="submit" data-t="auth.invite.go"></button>
      </form>
    </details>
  </div>

  <div class="glass flip" style="border-radius:var(--r-l);padding:16px 18px;margin-top:16px">
    <div style="font-size:13.5px;font-weight:650;margin-bottom:6px" data-t="auth.why"></div>
    <p class="muted" style="font-size:13px;line-height:1.7" data-t="auth.why.body"></p>
  </div>
</main>

<footer class="foot">
  <div class="shell foot-bar flip">
    <span class="num ltr">© <span id="yr">2026</span> Yuan.pk Pvt. Ltd.</span>
    <a href="/"><span data-t="nav.market"></span></a>
  </div>
</footer>

<script src="/assets/i18n.js?v=717b33b3"></script>
<script src="/assets/yuan.js?v=835b52a2"></script>
<script src="/assets/login.js"></script>
</body>
</html>
